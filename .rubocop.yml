AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "examples/**/*"
    - "templates/**/*"
    - "vendor/**/*"
    - "themes/**/*"
    - "pkg/**/*"

Style/Documentation:
  Enabled: false

Metrics/MethodLength:
  Max: 30

Metrics/BlockLength:
  Max: 60
  Exclude:
    - "spec/**/*"

Metrics/AbcSize:
  Max: 25

Style/StringLiterals:
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 140

Layout/EndOfLine:
  EnforcedStyle: lf
